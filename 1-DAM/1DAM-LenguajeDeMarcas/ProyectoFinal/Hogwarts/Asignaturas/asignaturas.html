                <div class="row mt-4 justify-content-center margen-izquierdo">
                    <div class="col-md-4 mb-4"> <!-- Agregamos la clase mb-4 para agregar margen inferior -->

                                <div class="flip-card-inner">

                                    </div>
                                    <div class="flip-card-back">
                                        <h1>Encantamientos</h1>
                                        <hr>
                                        <p>
                                            Encantamientos es una asignatura esencial en Hogwarts, impartida por el amable profesor Filius Flitwick. Los estudiantes aprenden movimientos de varita y pronunciación de hechizos, trabajando en parejas. La materia es obligatoria durante los primeros cinco años, culminando en los exámenes T.I.M.O., que incluyen partes teóricas y prácticas. Solo aquellos con altas calificaciones pueden avanzar al nivel ÉXTASIS, requerido para carreras como Auror o Sanador. Hermione Granger, Harry Potter y sus amigos disfrutaron de las enseñanzas y la compañía del profesor Flitwick, conocido por su carácter amable.</p>
                                    </div>
                                </div>
                            </div>
                        </figure>
                    </div>
                    <div class="col-md-4 mb-4"> <!-- Agregamos la clase mb-4 para agregar margen inferior -->
                        <figure>
                            <div class="position-relative">
                                <div class="flip-card">
                                    <div class="flip-card-inner">
                                        <div class="flip-card-front">
                                            <img src="image/Transformaciones.png" class="carta">
                                        </div>
                                        <div class="flip-card-back">
                                            <h1 class="letraPequeña">Transformaciones</h1>
                                            <hr>
                                            <p>En Transformaciones, los estudiantes aprenden a alterar la forma o la apariencia de los objetos o criaturas mediante el uso de hechizos específicos y habilidades prácticas. Se centra en la magia que cambia la naturaleza de las cosas, desde convertir animales en vasijas hasta modificar la estructura molecular de los objetos. Los estudiantes exploran una variedad de técnicas y teorías detrás de la transformación mágica, desarrollando habilidades tanto teóricas como prácticas para dominar este arte complejo y poderoso.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </figure>
                    </div>
                    <div class="col-md-4 mb-4"> <!-- Agregamos la clase mb-4 para agregar margen inferior -->
                        <figure>
                            <div class="position-relative">
                                <div class="flip-card">
                                    <div class="flip-card-inner">
                                        <div class="flip-card-front">
                                            <img src="image/DCAO.png" class="carta">
                                        </div>
                                        <div class="flip-card-back">
                                            <h1>DCAO</h1>
                                            <hr>
                                            <p>La clase de Defensa Contra las Artes Oscuras en Hogwarts enseña a los estudiantes a protegerse contra las fuerzas malignas. El currículo incluye el estudio y práctica de hechizos defensivos, el aprendizaje sobre criaturas oscuras, y la defensa contra maleficios y maldiciones. Los estudiantes practican encantamientos protectores y ofensivos, como el encantamiento Patronus y los escudos mágicos. Además, se les instruye en tácticas para enfrentar a los magos tenebrosos y en cómo reconocer y neutralizar diferentes tipos de magia oscura. La clase enfatiza tanto la teoría como la práctica.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </figure>
                    </div>
                </div>
            </div>
            <div class="row justify-content-center barra">
                <div class="row mt-4 justify-content-center margen-izquierdo">
                    <div class="col-md-4 mb-4"> <!-- Agregamos la clase mb-4 para agregar margen inferior -->
                        <figure>
                            <div class="flip-card">
                                <div class="flip-card-inner">
                                    <div class="flip-card-front">
                                        <img src="image/Posiones.png" class="carta">
                                    </div>
                                    <div class="flip-card-back">
                                        <h1>Posiones</h1>
                                        <hr>
                                        <p>La clase de Pociones en Hogwarts enseña a los estudiantes a crear brebajes mágicos con efectos específicos, siguiendo recetas detalladas y utilizando ingredientes raros y a menudo peligrosos. El currículo abarca pociones curativas, transformadoras, venenosas y antídotos, destacando la importancia de la precisión y la paciencia, ya que cualquier error puede resultar en consecuencias inesperadas. Además, los estudiantes aprenden sobre las propiedades mágicas de los ingredientes y cómo interactúan para formar pociones efectivas, desarrollando habilidades en la mezcla y preparación meticulosa.</p>
                                    </div>
                                </div>
                            </div>
                        </figure>
                    </div>
                    <div class="col-md-4 mb-4"> <!-- Agregamos la clase mb-4 para agregar margen inferior -->

                                        </div>
                                        <div class="flip-card-back">
                                            <h1>Herbología</h1>
                                            <hr>
                                            <p>
                                                La clase de Herbología en Hogwarts se centra en el estudio de las plantas mágicas y sus propiedades. Los estudiantes aprenden a identificar y cuidar una amplia variedad de plantas, desde las más simples hasta las más peligrosas. Además, exploran las aplicaciones prácticas de estas plantas en pociones, encantamientos y otras áreas de la magia. La asignatura se imparte en invernaderos especialmente diseñados, donde los estudiantes tienen la oportunidad de interactuar directamente con las plantas y aprender técnicas de cultivo y recolección.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </figure>
                    </div>
                    <div class="col-md-4 mb-4"> <!-- Agregamos la clase mb-4 para agregar margen inferior -->

                                            <img src="image/HistoriaDeLaMagia.png" class="carta">
                                        </div>
                                        <div class="flip-card-back">
                                            <h1>Historia de la Magia</h1>
                                            <hr>
                                            <p>
                                                La asignatura de Historia de la Magia en Hogwarts explora la evolución de la magia a lo largo de los siglos, desde los primeros registros hasta los desarrollos recientes. Los estudiantes estudian eventos importantes, figuras destacadas y descubrimientos clave en la historia mágica mundial, examinando textos históricos y artefactos mágicos para comprender el legado mágico que ha dado forma al mundo mágico actual.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
