                                                            Ministerio de Magia antes de aceptar un puesto como
                                                            profesora en Hogwarts, donde enseñó Transformaciones durante

                                                    <tr>
                                                        <th>Biografía</th>
                                                        <td>
                                                            <p>
                                                                El Profesor Filius Flitwick, un carismático y habilidoso
                                                                mago, deslumbra a todos en Hogwarts con su pasión por
                                                                los encantamientos. A pesar de su diminuto tamaño, su
                                                                conocimiento y destreza en la magia son inmensos.
                                                                Flitwick, antiguo alumno de la misma escuela donde ahora
                                                                enseña, fue seleccionado en la casa Ravenclaw durante su
                                                                juventud, y eventualmente regresó como profesor para
                                                                compartir su sabiduría con las generaciones futuras. No
                                                                solo se destaca por su enseñanza académica, sino también
                                                                por su papel como Jefe de Casa de Ravenclaw, donde guía
                                                                y apoya a los estudiantes bajo su cuidado.
                                                            </p>
                                                            <p>
                                                                Durante la Segunda Guerra Mágica, Flitwick demostró su
                                                                valentía y lealtad a Hogwarts al participar activamente
                                                                en la defensa del castillo contra las fuerzas de Lord
                                                                Voldemort y sus seguidores. Su magia formidable y su
                                                                ingenio fueron recursos vitales en la batalla, y su
                                                                liderazgo inspiró a estudiantes y colegas por igual. A
                                                                pesar de los desafíos y peligros, Flitwick se mantuvo
                                                                firme en la protección de la escuela y sus ocupantes,
                                                                encarnando el espíritu de resistencia contra la
                                                                oscuridad.
                                                            </p>
                                                            <p>
                                                                Además de su papel heroico durante la guerra, Flitwick
                                                                es conocido por su amabilidad y apoyo hacia los
                                                                estudiantes, creando un ambiente de aprendizaje cálido y
                                                                estimulante en el aula de Encantamientos. Su entusiasmo
                                                                contagioso por la magia ha inspirado a numerosos jóvenes
                                                                magos y brujas a explorar y dominar el arte de los
                                                                encantamientos. En resumen, el Profesor Flitwick es una
                                                                figura emblemática en Hogwarts, cuyo legado perdura no
                                                                solo por su magia, sino también por su dedicación
                                                                inquebrantable a la causa de la educación mágica y la
                                                                defensa de la luz contra las tinieblas.
                                                            </p>
                                                        </td>
