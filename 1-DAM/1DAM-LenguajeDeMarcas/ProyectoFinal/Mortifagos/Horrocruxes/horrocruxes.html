            <h1 class="letraBlanca">Horrocruxes</h1>

            <picture>
                <source srcset="../../image/titulo-bajo.png" type="image/webp">
                <img src="../../image/titulo-bajo.png" class="title-decoration">
            </picture>

        </div>
        <div class="container-fluid justify-content-center">
            <div class="row justify-content-center barra">
                <div class="row mt-4 justify-content-center margen-izquierdo">
                    <div class="col-md-4 mb-4"> <!-- Agregamos la clase mb-4 para agregar margen inferior -->
                        <figure>
                            <div class="flip-card">
                                <div class="flip-card-inner">
                                    <div class="flip-card-front">
                                        <img src="../image/anilloResurreccion.png" class="carta">
                                    </div>
                                    <div class="flip-card-back">
                                        <h1>Anillo de Sorvolo Gaunt</h1>
                                        <hr>
                                        <p>
                                            Tom Ryddle, conocido como Lord Voldemort, creó su primer horrocrux a los
                                            dieciséis años usando un anillo de su abuelo materno, Sorvolo Gaunt, tras
                                            asesinar a su padre. Voldemort ocultó el anillo en la casa de los Gaunt,
                                            donde Dumbledore lo encontró y destruyó en 1996. Antes de morir, Dumbledore
                                            escondió la piedra del anillo, la Piedra de la Resurrección, dentro de una
                                            snitch dorada. En 1998, Harry utilizó la piedra para invocar a seres
                                            queridos antes de enfrentarse a Voldemort, dejando caer la piedra en el
                                            Bosque Prohibido.</p>
                                    </div>
                                </div>
                            </div>
                        </figure>
                    </div>
                    <div class="col-md-4 mb-4"> <!-- Agregamos la clase mb-4 para agregar margen inferior -->
                        <figure>
                            <div class="position-relative">
                                <div class="flip-card">
                                    <div class="flip-card-inner">
                                        <div class="flip-card-front">
                                            <img src="../image/diarioTom.png" class="carta">
                                        </div>
                                        <div class="flip-card-back">
                                            <h1>Diario de Tom Riddle</h1>
                                            <hr>
                                            <p>Tom Ryddle creó su segundo horrocrux durante su sexto año en Hogwarts,
                                                utilizando su diario tras asesinar a Myrtle Warren. Voldemort confió el
                                                diario a Lucius Malfoy, quien años después se lo pasó a Ginny Weasley.
                                                Harry y Ron encontraron el diario en el baño de Myrtle la Llorona, y
                                                Harry descubrió que escribir en él permitía comunicarse con el joven Tom
                                                Ryddle. El fragmento de alma de Ryddle poseyó a Ginny, usándola para
                                                abrir la Cámara de los Secretos. Harry salvó a Ginny y destruyó el
                                                diario con un colmillo de basilisco.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </figure>
                    </div>
                </div>
            </div>
            <div class="row justify-content-center barra">
                <div class="row mt-4 justify-content-center margen-izquierdo">
                    <div class="col-md-4 mb-4"> <!-- Agregamos la clase mb-4 para agregar margen inferior -->
                        <figure>
                            <div class="position-relative">
                                <div class="flip-card">
                                    <div class="flip-card-inner">
                                        <div class="flip-card-front">
                                            <img src="../image/relicarioSlytherin.png" class="carta">
                                        </div>
                                        <div class="flip-card-back">
                                            <h1>Guardapelo de Salazar Slytherin</h1>
                                            <hr>
                                            <p>El tercer horrocrux de Voldemort fue el guardapelo de Salazar Slytherin,
                                                elegido por su valor histórico y herencia. Pasó por varias manos antes
                                                de ser robado por Voldemort y oculto en una cueva protegida por Inferi y
                                                hechizos. Fue recuperado por Harry, Ron y Hermione en el Ministerio de
                                                Magia y finalmente destruido por Ron en el Bosque de Dean, tras
                                                torturarlo con ilusiones.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </figure>
                    </div>
                    <div class="col-md-4 mb-4"> <!-- Agregamos la clase mb-4 para agregar margen inferior -->
                        <figure>
                            <div class="flip-card">
                                <div class="flip-card-inner">
                                    <div class="flip-card-front">
                                        <img src="../image/copaHufflepuff.png" class="carta">
                                    </div>
                                    <div class="flip-card-back">
                                        <h1>Copa de Helga Hufflepuff</h1>
                                        <hr>
                                        <p>

                                            Tom Ryddle creó su cuarto horrocrux utilizando la copa de Helga Hufflepuff,
                                            asesinando a Hepzibah Smith y luego inculpando a su elfina doméstica por el
                                            crimen. Voldemort confió la copa a Bellatrix Lestrange, quien la protegió en
                                            la bóveda familiar de Gringotts. Harry, Ron y Hermione robaron la copa del
                                            banco y Hermione la destruyó utilizando un colmillo de basilisco.</p>
                                    </div>
                                </div>
                            </div>
                        </figure>
                    </div>
                    <div class="col-md-4 mb-4"> <!-- Agregamos la clase mb-4 para agregar margen inferior -->
                        <figure>
                            <div class="position-relative">
                                <div class="flip-card">
                                    <div class="flip-card-inner">
                                        <div class="flip-card-front">
                                            <img src="../image/diademaRavenclaw.png" class="carta">
                                        </div>
                                        <div class="flip-card-back">
                                            <h1>Diadema de Rowena Ravenclaw</h1>
                                            <hr>
                                            <p>Tom Ryddle creó su quinto horrocrux utilizando la diadema de Rowena Ravenclaw, que representaba su enorme inteligencia. Helena Ravenclaw, el fantasma de la Casa Ravenclaw, reveló su ubicación en un árbol hueco en los bosques de Albania. Harry descubrió la diadema en la Sala de los Menesteres y, al darse cuenta de su naturaleza, buscó información con Helena Ravenclaw, quien reveló que Lord Voldemort también había buscado la diadema en el pasado.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </figure>
                    </div>
                </div>
            </div>
            <div class="row justify-content-center barra">
                <div class="row mt-4 justify-content-center margen-izquierdo">
                    <div class="col-md-4 mb-4"> <!-- Agregamos la clase mb-4 para agregar margen inferior -->
                        <figure>
                            <div class="position-relative">
                                <div class="flip-card">
                                    <div class="flip-card-inner">
                                        <div class="flip-card-front">
                                            <img src="../image/nagini.png" class="carta">
                                        </div>
                                        <div class="flip-card-back">
                                            <h1>Nagini</h1>
                                            <hr>
                                            <p>El sexto horrocrux de Voldemort fue Nagini, su serpiente compañera. A pesar de que era poco común convertir animales en horrocruxes, Voldemort lo hizo para alcanzar su objetivo de seis horrocruxes y debido a la lealtad de Nagini en momentos de debilidad. La serpiente se convirtió en un horrocrux con el asesinato de Bertha Jorkins en 1994. Después de la destrucción de los otros horrocruxes, Voldemort protegió a Nagini con un encantamiento. Levantó la protección cuando creyó que Harry Potter estaba muerto, lo que permitió que Neville Longbottom la matara con la espada de Gryffindor por orden de Harry.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </figure>
                    </div>
                    <div class="col-md-4 mb-4"> <!-- Agregamos la clase mb-4 para agregar margen inferior -->
                        <figure>
                            <div class="flip-card">
                                <div class="flip-card-inner">
                                    <div class="flip-card-front">
                                        <img src="../image/harryPotter.png" class="carta">
                                    </div>
                                    <div class="flip-card-back">
                                        <h1>Harry Potter</h1>
                                        <hr>
                                        <p>El séptimo horrocrux de Voldemort fue Harry Potter, aunque no fue intencional. Voldemort no sabía que Harry se había convertido en un horrocrux. Esta situación se debe a que Harry llevaba un fragmento del alma de Voldemort, lo que le permitía hablar pársel. Las muertes de James Potter y Lily Evans fueron las que permitieron que este hechizo se realizara. Harry descubre la verdad sobre su conexión con Voldemort cuando explora los últimos recuerdos de Snape, donde Dumbledore le reveló a Snape esta información. El horrocrux dentro de Harry fue destruido por Voldemort cuando intentó matarlo con la maldición asesina, Avada Kedavra.</p>
                                    </div>
                                </div>
                            </div>
                        </figure>
                    </div>
                </div>
