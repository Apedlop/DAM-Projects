                                                    <tr>
                                                        <th>Casa</th>

                                                        <td>2 de mayo de 1998 (71 años), Gran Comedor, Castillo Hogwarts

                                                    </tr>
                                                    <tr>
                                                        <th>Biografía</th>
                                                        <td>
                                                            <p>Lord Voldemort, nacido como Tom Marvolo Riddle el 31 de
                                                                diciembre de 1926 en un orfanato de Londres, mostró
                                                                desde joven habilidades mágicas y crueldad. Asistió a
                                                                Hogwarts y fue seleccionado para Slytherin, destacándose
                                                                académicamente mientras investigaba las Artes Oscuras y
                                                                los Horrocruxes. Tras graduarse, trabajó en Borgin and
                                                                Burkes y asesinó a su familia paterna para ocultar su
                                                                ascendencia muggle. Adoptó el nombre de Lord Voldemort y
                                                                reunió seguidores conocidos como mortífagos, desatando
                                                                una ola de terror.
                                                            </p>
                                                            <p>
                                                                En 1981, al intentar matar al bebé Harry Potter, una
                                                                maldición rebotó y lo dejó sin cuerpo. Con la ayuda de
                                                                seguidores como Peter Pettigrew, recuperó una forma
                                                                física en 1995 y comenzó su segundo ascenso al poder.
                                                                Durante la Batalla de Hogwarts en 1998, Voldemort fue
                                                                derrotado definitivamente por Harry Potter. La
                                                                destrucción de sus Horrocruxes y su propia maldición
                                                                rebotada marcaron su final y el fin de la Segunda Guerra
                                                                Mágica.
                                                            </p>
                                                        </td>
                                                    </tr>

                                                    <tr>
                                                        <th>Biografía</th>
                                                        <td>
                                                            <p>Bellatrix Lestrange, nacida como Bellatrix Black, fue una
                                                                de las más leales y sádicas seguidoras de Lord
                                                                Voldemort. Nacida en una familia de sangre pura, los
                                                                Black, mostró una temprana afinidad por las Artes
                                                                Oscuras y un desprecio por los no-mágicos. Asistió a
                                                                Hogwarts y fue seleccionada para Slytherin, donde se
                                                                destacó por su talento y crueldad. Después de la
                                                                escuela, se casó con Rodolphus Lestrange, pero su
                                                                verdadera devoción siempre fue hacia Voldemort.
                                                            </p>
                                                            <p>
                                                                Durante la Primera Guerra Mágica, Bellatrix se ganó la
                                                                reputación de ser una mortífaga feroz y despiadada. Tras
                                                                la caída temporal de Voldemort en 1981, Bellatrix fue
                                                                capturada y encarcelada en Azkaban por torturar a los
                                                                Aurores Frank y Alice Longbottom hasta la locura. Escapó
                                                                de Azkaban en 1996 y rápidamente retomó su papel como
                                                                una de las principales seguidoras de Voldemort.
                                                            </p>
                                                            <p>
                                                                Bellatrix participó en varios enfrentamientos
                                                                importantes durante la Segunda Guerra Mágica, incluyendo
                                                                la Batalla del Departamento de Misterios y la Batalla de
                                                                Hogwarts. Fue responsable de la muerte de su prima
                                                                Sirius Black y torturó a Hermione Granger en la Mansión
                                                                Malfoy. Bellatrix murió en la Batalla de Hogwarts en
                                                                1998 a manos de Molly Weasley, poniendo fin a su brutal
                                                                legado.</p>
                                                        </td>

                                                    <tr>
                                                        <th>Biografía</th>
                                                        <td>
                                                            <p>
                                                                Lucius Malfoy, nacido en 1954, es un mago de sangre pura
                                                                de una familia rica y antigua. Fue educado en Hogwarts,
                                                                en la casa de Slytherin. Después de graduarse, se casó
                                                                con Narcissa Black y tuvo un hijo, Draco Malfoy. Como
                                                                uno de los seguidores más influyentes de Lord Voldemort,
                                                                participó activamente en la Primera Guerra Mágica,
                                                                aunque afirmó haber actuado bajo la influencia de la
                                                                maldición Imperius tras la caída de Voldemort para
                                                                evitar la prisión.
                                                            </p>
                                                            <p>
                                                                Cuando Voldemort resurgió en 1995, Lucius volvió a su
                                                                servicio y se involucró en eventos clave como la Batalla
                                                                del Departamento de Misterios. Sin embargo, su fracaso y
                                                                la captura de varios mortífagos llevaron a la caída en
                                                                desgracia de su familia. Durante la Segunda Guerra
                                                                Mágica, su mansión fue utilizada como cuartel general de
                                                                los mortífagos. Tras la derrota de Voldemort en 1998,
                                                                Lucius fue arrestado pero evitó una sentencia severa al
                                                                cooperar con el nuevo gobierno, tratando luego de
                                                                reconstruir su vida y reputación.
                                                            </p>

                                                            <p>
                                                                Barty Crouch Jr., nacido en 1962, es el hijo de Barty
                                                                Crouch Sr., un alto funcionario del Ministerio de Magia.
                                                                Aunque provenía de una familia que defendía la pureza de
                                                                sangre, fue criado con una estricta disciplina. Barty
                                                                Jr. se convirtió en un seguidor fanático de Lord
                                                                Voldemort durante la Primera Guerra Mágica y participó
                                                                en torturas junto a Bellatrix Lestrange. Fue capturado y
                                                                sentenciado a Azkaban, pero escapó con la ayuda de su
                                                                madre, quien tomó su lugar en prisión usando una Poción
                                                                Multijugos.
                                                            </p>
                                                            <p>
                                                                Oculto bajo la protección de su padre, Barty Jr. fue
                                                                descubierto y castigado con el control de un
                                                                Encantamiento Imperius. Sin embargo, logró escapar y se
                                                                unió nuevamente a los mortífagos. En 1994, secuestró a
                                                                Alastor Moody y, disfrazado como él, se infiltró en
                                                                Hogwarts como profesor de Defensa Contra las Artes
                                                                Oscuras. Manipuló el Torneo de los Tres Magos para
                                                                asegurar el regreso de Voldemort, capturando a Harry
                                                                Potter en el proceso. Finalmente, fue descubierto por
                                                                Harry y Dumbledore, y tras ser interrogado con
                                                                Veritaserum, fue entregado a los Dementores y recibió el
                                                                beso del Dementor, que lo dejó en un estado peor que la
                                                                muerte.
