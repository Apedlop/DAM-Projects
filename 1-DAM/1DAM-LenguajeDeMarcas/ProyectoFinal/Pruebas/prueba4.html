<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Pagination</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/5.0.0-beta2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            color: #222;
            text-align: center;
            margin-top: 5%;
        }

        .question-container {
            display: none;
        }

        .question-container.active {
            display: block;
        }

        .pagination {
            justify-content: center;
        }

        .modal-backdrop {
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1050;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .5);
        }

        .modal.active {
            display: block;
        }

        .question-label {
            color: blue;
            font-weight: bold;
        }

        .option-label {
            color: white;
        }
    </style>
</head>

<body ng-app="quizApp">
    <div ng-controller="QuizController">
        <div ng-repeat="question in questions" class="question-container" ng-class="{'active': $index === currentPage}">
            <div class="form-group">
                <label class="letraPreg question-label">{{ question.text }}</label>
                <div ng-repeat="option in question.options">
                    <label class="option-label">
                        <input type="radio" name="q{{$parent.$index + 1}}" value="{{ option.value }}" required> {{ option.text }}
                    </label>
                </div>
            </div>
        </div>

        <div class="text-center">
            <nav aria-label="Page navigation example">
                <ul class="pagination">
                    <li class="page-item" ng-class="{'disabled': pagePrevDisabled()}">
                        <a class="page-link" href="#" aria-label="Previous" ng-click="prevPage()">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>
                    <li class="page-item" ng-repeat="n in range()" ng-class="{'active': n == currentPage}">
                        <a class="page-link" href="#" ng-click="setPage(n)">{{ n + 1 }}</a>
                    </li>
                    <li class="page-item" ng-class="{'disabled': pageNextDisabled()}">
                        <a class="page-link" href="#" aria-label="Next" ng-click="nextPage()">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <button type="button" class="btn btn-primary" ng-click="calculateResult()">Finish Quiz</button>
        </div>

        <div class="modal" id="resultModal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="resultModalLabel">Your Hogwarts House</h5>
                        <button type="button" class="btn-close" ng-click="closeModal()"></button>
                    </div>
                    <div class="modal-body" id="resultText">
                        {{ resultText }}
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" ng-click="closeModal()">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var app = angular.module('quizApp', []);

        app.controller("QuizController", function ($scope) {
            $scope.currentPage = 0;
            $scope.questions = [
                {
                    text: "1. What trait do you value most?",
                    options: [
                        { text: "Bravery", value: "Gryffindor" },
                        { text: "Loyalty", value: "Hufflepuff" },
                        { text: "Intelligence", value: "Ravenclaw" },
                        { text: "Ambition", value: "Slytherin" }
                    ]
                },
                {
                    text: "2. What is your favorite class at Hogwarts?",
                    options: [
                        { text: "Charms", value: "Ravenclaw" },
                        { text: "Defense Against the Dark Arts", value: "Gryffindor" },
                        { text: "Potions", value: "Slytherin" },
                        { text: "Herbology", value: "Hufflepuff" }
                    ]
                },
                {
                    text: "3. Which magical creature do you like the most?",
                    options: [
                        { text: "Niffler", value: "Hufflepuff" },
                        { text: "Phoenix", value: "Ravenclaw" },
                        { text: "Hippogriff", value: "Gryffindor" },
                        { text: "Basilisk", value: "Slytherin" }
                    ]
                }
            ];

            $scope.range = function () {
                var rangeSize = $scope.questions.length;
                var ret = [];
                for (var i = 0; i < rangeSize; i++) {
                    ret.push(i);
                }
                return ret;
            };

            $scope.prevPage = function () {
                if ($scope.currentPage > 0) {
                    $scope.currentPage--;
                }
            };

            $scope.pagePrevDisabled = function () {
                return $scope.currentPage === 0 ? "disabled" : "";
            };

            $scope.conteo = function () {
                return Math.ceil($scope.questions.length) - 1;
            };

            $scope.nextPage = function () {
                if ($scope.currentPage < $scope.conteo()) {
                    $scope.currentPage++;
                }
            };

            $scope.pageNextDisabled = function () {
                return $scope.currentPage === $scope.conteo() ? "disabled" : "";
            };

            $scope.setPage = function (page) {
                $scope.currentPage = page;
            };

            $scope.calculateResult = function () {
                const selectedAnswers = [];
                $scope.questions.forEach((question, index) => {
                    const selectedOption = document.querySelector(`input[name='q${index + 1}']:checked`);
                    if (selectedOption) {
                        selectedAnswers.push(selectedOption.value);
                    }
                });

                const houseCounts = {
                    Gryffindor: 0,
                    Hufflepuff: 0,
                    Ravenclaw: 0,
                    Slytherin: 0
                };

                selectedAnswers.forEach(answer => {
                    houseCounts[answer]++;
                });

                let resultHouse = '';
                let maxCount = 0;

                for (const house in houseCounts) {
                    if (houseCounts[house] > maxCount) {
                        maxCount = houseCounts[house];
                        resultHouse = house;
                    }
                }

                $scope.resultText = `Congratulations! You belong to ${resultHouse}!`;
                document.getElementById('resultModal').classList.add('active');
            };

            $scope.closeModal = function () {
                document.getElementById('resultModal').classList.remove('active');
            };
        });
    </script>
</body>

</html>
