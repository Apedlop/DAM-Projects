<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transición de Páginas</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css?family=Poppins:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i&subset=devanagari,latin-ext');

        body {
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 400;
            line-height: 1.4;
            background-position: center;
            background-repeat: repeat;
            background-size: 7%;
            background-color: #274f75;
            transition: all 200ms linear;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        .start-header {
            opacity: 1;
            transform: translateY(0);
            padding: 16px;
            padding-left: 20px;
            -webkit-transition: all 0.3s ease-out;
            transition: all 0.3s ease-out;
        }

        .navigation-wrap {
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            height: 6.2em;
            -webkit-transition: all 0.3s ease-out;
            transition: all 0.3s ease-out;
            background-color: #21353e !important;
            color: #999999 !important;
            box-shadow: 0 2px 4px rgba(1, 1, 1, 0.1);
        }

        .navbar {
            padding: 0;
            z-index: 2;
        }

        .navbar-brand img {
            height: 28px;
            width: auto;
            display: block;
            filter: brightness(93%);
            -webkit-transition: all 0.3s ease-out;
            transition: all 0.3s ease-out;
            margin-left: 30px;
        }

        .nav-link {
            color: #a3a3a3 !important;
            font-weight: 500;
            transition: all 200ms linear;
        }

        .nav-item:hover .nav-link {
            color: #b69451 !important;
        }

        .nav-item:after {
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            content: '';
            background-color: #b69451;
            opacity: 0;
            transition: all 200ms linear;
        }

        .nav-item:hover:after {
            bottom: 0;
            opacity: 1;
        }

        .nav-item {
            position: relative;
            transition: all 200ms linear;
        }

        .navbar-nav>li {
            margin-right: 20px;
        }

        .dropdown-toggle::after {
            display: none;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            z-index: 1000;
        }

        .nav-item:hover .dropdown-menu {
            display: block;
        }

        .dropdown-item:hover {
            background-color: #b69451c2;
            color: #000000;
        }

        .nav-bar.left {
            left: 0;
        }

        .nav-bar.right {
            right: 0;
        }

        .nav-bar {
            position: absolute;
            top: 105px;
            width: 31vw;
        }

        img,
        svg {
            vertical-align: middle;
            border-style: none;
        }

        .nav-bar-corner.left {
            left: 0;
        }

        .nav-bar-corner {
            position: absolute;
            top: 110px;
            flex-shrink: 0;
        }

        .img-fluid {
            height: 20vh;
            max-width: 100%;
        }

        .nav-bar-corner.right {
            right: 0;
        }

        .nav-bar-corner.bottomLeft {
            bottom: 0;
            left: 0;
            top: auto;
        }

        .nav-bar-corner.bottomRight {
            bottom: 0;
            right: 0;
            top: auto;
        }

        .nav-bar-corner-container1 {
            position: absolute;
            bottom: -100dvh;
            margin-bottom: 112px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            box-sizing: border-box;
            z-index: 0;
        }

        .nav-bar-corner-container {
            z-index: 0;
        }

        button.colorModo {
            background-color: #21353e;
            border-color: #21353e;
        }

        img.logo {
            margin-top: -5px;
            margin-left: 0px;
            width: 60px;
            height: auto;
        }

        div.posicionModo {
            text-align: right;
        }

        img#darkImage {
            display: none;
        }

        h1.titulo {
            text-decoration: none;
            text-align: center;
            color: #b69451;
        }

        div.altura {
            height: 37px;
        }

        a.decoracion {
            text-decoration: none;
            color: #b69451c2;
        }

        .ancho {
            width: 80vw;
            margin-left: 10vw;
            margin-top: 0px;
        }

        .letraBlanca {
            color: white;
        }

        .margen {
            margin-top: 50px;
        }

        .footer {
            width: 55px;
            transition: transform 0.3s ease;
        }

        .footer2 {
            width: 45px;
            transition: transform 0.3s ease;
        }

        .footer:hover,
        .footer2:hover {
            transform: scale(1.2);
        }

        .fondoFooter {
            background-color: #21353e;
        }

        .fondoFooter2 {
            background-color: #283b45;
            color: white;
        }

        .lineaSeparacion {
            position: relative;
            width: 100%;
        }

        .lineaSeparacion .izquierda {
            position: absolute;
            left: 0;
            transform: translateY(-50%);
            width: 31vw;
        }

        .lineaSeparacion .derecha {
            position: absolute;
            right: 0;
            transform: translateY(-50%);
            width: 31vw;
        }

        /* Estilos para la transición de desvanecimiento */
        body {
            opacity: 1;
            transition: opacity 1s ease-in-out;
        }

        .fade-out {
            opacity: 0;
        }

        /* Estilos para la pantalla de carga */
        .contenedor_loader {
            background-color: #f3f3f3;
            position: fixed;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
        }

        .loader,
        .loader:before,
        .loader:after {
            border-radius: 50%;
            width: 2.5em;
            height: 2.5em;
            animation: loader 1.5s infinite ease-in-out;
        }

        .loader {
            color: aqua;
            font-size: 13px;
            position: relative;
        }

        .loader:before,
        .loader:after {
            content: '';
            position: absolute;
            top: 0;
        }

        .loader:before {
            left: -3.5em;
        }

        .loader:after {
            left: 3.5em;
        }

        @keyframes loader {
            0%,
            80%,
            100% {
                box-shadow: 0 2.5em 0 -1.3em;
            }

            40% {
                box-shadow: 0 2.5em 0 0em;
            }
        }
    </style>
</head>

<body>
    <!-- Pantalla de carga -->
    <div class="contenedor_loader" id="loader">
        <div class="loader"></div>
    </div>

    <!-- Contenido principal -->
    <div id="main-content">
        <!-- Enlaces que desencadenan la pantalla de carga -->
        <a href="prueba.html" onclick="redirectWithLoading(event, 'prueba.html')">Ir a Prueba 1</a>
        <a href ="prueba2.html" onclick="redirectWithLoading(event, 'prueba2.html')">Ir a Prueba 2</a>

        <!-- Contenido principal -->
        <div id="main-content">
            <!-- Contenido de tu página aquí -->
            <div class="container pt-4">
                <!-- Section: Social media -->
                <section class="mb-4">
                    <!-- Facebook -->
                    <a data-mdb-ripple-init class="btn btn-link btn-floating btn-lg text-body m-1"
                        href="https://www.facebook.com/harrypotter" role="button"><img src="image/facebook.png"
                            class="footer"></a>

                    <!-- Instagram -->
                    <a data-mdb-ripple-init class="btn btn-link btn-floating btn-lg text-body m-1"
                        href="https://www.instagram.com/harrypotter/?hl=es" role="button"><img
                            src="image/instagram.png" class="footer"></a>

                    <!-- Twitter -->
                    <a data-mdb-ripple-init class="btn btn-link btn-floating btn-lg text-body m-1"
                        href="https://x.com/harrypotter" role="button"><img src="image/twitter.png"
                            class="footer2"></a>

                    <!-- YouTube -->
                    <a data-mdb-ripple-init class="btn btn-link btn-floating btn-lg text-body m-1"
                        href="https://www.youtube.com/@harrypotter" role="button"><img src="image/youtube.png"
                            class="footer"></a>

                    <!-- TikTok -->
                    <a data-mdb-ripple-init class="btn btn-link btn-floating btn-lg text-body m-1"
                        href="https://www.tiktok.com/@harrypotter" role="button"><img src="image/tik-tok.png"
                            class="footer"></a>

                </section>
                <!-- Section: Social media -->
            </div>
            <!-- Grid container -->

            <!-- Copyright -->
            <div class="text-center p-3 fondoFooter2">
                Copyright © 2024
            </div>
        </div>
    </div>

    <script>
        function redirectWithLoading(event, destinationURL) {
            event.preventDefault();
            const loader = document.getElementById('loader');
            const mainContent = document.getElementById('main-content');
            loader.style.opacity = 1;
            loader.style.visibility = 'visible';
            mainContent.style.opacity = 0;
            setTimeout(() => {
                window.location.href = destinationURL;
            }, 1000);
        }
    </script>
</body>

</html>
