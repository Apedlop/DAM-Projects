<html>
    <head>
        <title>Contraseña</title>
    </head>
    <body>
        <h1>Ejercicio 1 // Contraseña</h1>
        <script>
            const contrasenaValida = contrasena => contrasena == "hola" || contrasena == "buenas" ? true : false;

            let contrasena = prompt("Introduce una contraseña: ");
            document.write(`La contraseña es válida: ${contrasenaValida(contrasena)}`); // Muestra el resultado
        </script>
    </body>
</html>
